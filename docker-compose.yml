services:
  # ────────────────────────────────────────────────────
  # PostgreSQL with pgvector extension
  # pgvector adds VECTOR column type for semantic search
  # ────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: roottrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roottrace}
      POSTGRES_USER: ${POSTGRES_USER:-roottrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roottrace_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roottrace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────
  # FastAPI Backend
  # ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roottrace-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roottrace}:${POSTGRES_PASSWORD:-roottrace_secret}@postgres:5432/${POSTGRES_DB:-roottrace}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./incident-lab:/incident-lab:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ────────────────────────────────────────────────────
  # Next.js Frontend
  # ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roottrace-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
